name: Sync to GitHub Pages Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'design-nexus/design-nex.us'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH Key
        env:
          SYNC_SSH_KEY: ${{ secrets.SYNC_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SYNC_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to design-nexus.github.io
        run: |
          git push --force git@github.com:design-nexus/design-nexus.github.io.git main:main
